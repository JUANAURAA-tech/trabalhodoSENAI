<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Produção</title>

    <link rel="stylesheet" href="style.css">
</head>
 
<body>

<div class="container">

<h1>Controle de Produção</h1>

<input type="text" id="material" name="material" list="lista-materiais" placeholder="Digite o Material">

<datalist id="lista-materiais">
    <option value="ARAME GALVANIZADO 0,80 MM">
    <option value="BORRACHA 1MT">
    <option value="BORRACHA EVA 1MT /12CM">
    <option value="CAIXA 1 VC/VC.ULTRA">
    <option value="CAIXA 10 BELA">
    <option value="CAIXA 11 SUPBIG">
    <option value="CAIXA 12 DV">
    <option value="CAIXA 13 VM/ DV">
<option value="CAIXA 2 FA/PE/ES/">
<option value="CAIXA 4 FACPLUS">
<option value="CAIXA 6 PL VCP">
<option value="CAIXA 7 PIACAVA">
<option value="CAIXA 8 PELO ESFREGAO">
<option value="CAIXA DE GRAMPO">
<option value="CAIXA GARI 40">
<option value="CAIXA GARI 60">
<option value="CAIXA N13 D.VARRIDO">
<option value="CAIXA PELO 40">
<option value="CAPA N3">
<option value="CAPA N4">
<option value="CAPA PLASTICA P/ VASSOURA">
<option value="CAPA VASSOURA">
<option value="CEPA ESCOVA MAD">
<option value="CEPA P 06">
<option value="CEPA P03(PELO GARI 40)">
<option value="CEPA P04(ESCOVA PLAST)">
<option value="CEPA P08 (60CMO)">
<option value="CEPA P09 (HIDROESFREGAO)">
<option value="CEPA P1">
<option value="CEPA P10 (D. VARRIDO)">
<option value="CEPA P11 (HIDRO ESFREGAO)">
<option value="CEPA P15">
<option value="CEPA P2">
<option value="CEPA PS 30 MASTER">
<option value="CEPA PS 40 MASTER">
<option value="CEPA PS 60 MASTER">
<option value="CEPA RODO 30CM UND">
<option value="CEPA RODO 40CM UN">
<option value="CEPA RODO 60 CM UND">
<option value="CONJUNTO P1/5">
<option value="CONJUNTO P5">
<option value="CONJUNTO P1/4">
<option value="CONJUNTO P10">
<option value="CONJUNTO P2">
<option value="CONJUNTO P5/3 VCP VCU">
<option value="CONJUNTO P7">
<option value="ESPUMA HIDROESFREGAO UND">
<option value="EVA 1 MT/3MM">
<option value="EVA 32/9">
<option value="EVA 40/9">
<option value="EVA 60/3">
<option value="EVA 62/12">
<option value="EVA30/3">
<option value="EVA40/3">
<option value="FIBRA PIACAVA">
<option value="FITA CREPE 100MTS UND">
<option value="FITILHO PP COLORIDO F-10">

</datalist>

<input type="number" id="quantidade" step="0.001" placeholder="Quantidade">

<input type="date" id="data">

<select id="turno">
    <option>Manhã</option>
    <option>Tarde</option>
    <option>Noite</option>
</select>

<button class="btn-salvar" onclick="salvar()">Salvar Produção</button>

<section class="ficha-tecnica">
<h2>Cadastrar Ficha Técnica (Receita)</h2>

<input type="text" id="produto-receita" list="lista-materiais" placeholder="Nome do Produto Final">

<select id="subproduto-receita">
    <option value="">Selecione o Subproduto</option>
</select>

<input type="number" id="quantidade-receita" step="0.001" min="0.001" placeholder="Quantidade por caixa">

<button class="btn-salvar" onclick="adicionarSubproduto()">Adicionar Subproduto à Receita</button>
<button class="btn-salvar" onclick="salvarReceita()">Salvar Receita</button>

<div id="receita-em-montagem"></div>

<h3>Receitas cadastradas</h3>
<table>
<thead>
<tr>
<th>Produto Final</th>
<th>Composição</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="tabela-receitas"></tbody>
</table>
</section>

<input type="month" id="filtro-mes" onchange="filtrarPorMes()">

<span id="total-produzido">0</span>


<table>

<thead>

<tr>
<th>Material</th>
<th>Quantidade</th>
<th>Data</th>
<th>Turno</th>
<th>Saldo em estoque</th>
<th>❌</th>
</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

</div>

<script src="script.js"></script>

<script>
    const inputData = document.getElementById('data');
    const hoje = new Date();
    inputData.value = hoje.toISOString().split('T')[0];
</script>

</body>

</html>
